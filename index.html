<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I Love You ❤️</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    height: 100%;
    width: 100%;
  }

  canvas {
    display: block;
  }

  .hint {
    position: fixed;
    bottom: 14px;
    width: 100%;
    text-align: center;
    color: #ea80b0;
    font-family: Arial, sans-serif;
    opacity: 0.7;
    font-size: 14px;
  }
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div class="hint">I love you ❤️</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

ctx.font = "16px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

let t = 0;

function drawHeart() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const scale = Math.min(canvas.width, canvas.height) / 32;

  for (let i = 0; i < 220; i++) {
    const a = i * 0.12 + t;

    // Heart parametric equation
    const x = 16 * Math.pow(Math.sin(a), 3);
    const y =
      13 * Math.cos(a)
      - 5 * Math.cos(2 * a)
      - 2 * Math.cos(3 * a)
      - Math.cos(4 * a);

    const px = cx + x * scale;
    const py = cy - y * scale;

    ctx.fillStyle = "rgba(234,128,176,0.85)";
    ctx.shadowColor = "#fff";
    ctx.shadowBlur = 10;

    ctx.fillText("I love you", px, py);
  }

  t += 0.02;
  requestAnimationFrame(drawHeart);
}

drawHeart();
</script>

</body>
</html>
