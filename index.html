<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💖 Just One Question</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f0f1a;
      font-family: Arial, sans-serif;
    }

    .box {
      position: relative;
      width: 350px;
      height: 250px;
      border-radius: 16px;
      border: 2px solid #ffffff22;
      text-align: center;
    }

    h2 {
      color: white;
      margin-top: 30px;
    }

    button {
      position: absolute;
      padding: 12px 26px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    .yes {
      background: #4caf50;
      color: white;
      left: 50px;
      bottom: 30px;
    }

    .no {
      background: #f44336;
      color: white;
      left: 210px;
      bottom: 30px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Do you love me? 💖</h2>
    <button class="yes" onclick="yesClicked()">YES</button>
    <button class="no" onclick="moveNo()" ontouchstart="moveNo()">NO</button>
  </div>

  <script>
    function moveNo() {
      const noBtn = document.querySelector('.no');
      const box = document.querySelector('.box');

      const maxX = box.clientWidth - noBtn.offsetWidth;
      const maxY = box.clientHeight - noBtn.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function yesClicked() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          background:#0f0f1a;
          color:white;
          font-size:28px;
          text-align:center;
        ">
          💖 I knew it. You just made my day 💖
        </div>
      `;
    }
  </script>

</body>
</html>
